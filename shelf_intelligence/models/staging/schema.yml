version: 2
models:
  - name: stg_stores
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
  - name: stg_products
    columns:
      - name: sku_id
        data_tests:
          - unique
          - not_null
      - name: supplier_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_suppliers')
                field: supplier_id
  - name: stg_suppliers
    columns:
      - name: supplier_id
        data_tests:
          - unique
          - not_null
  - name: stg_stockout_events
    columns:
      - name: stockout_id
        data_tests:
          - unique
          - not_null
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: sku_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: sku_id
  - name: stg_replenishment_logs
    columns:
      - name: replenishment_id
        data_tests:
          - unique
          - not_null
  - name: stg_sales_transactions
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null